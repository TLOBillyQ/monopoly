# Format: window-invisible <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
window-invisible specifier claude master 
window-invisible coder claude coder 
window-invisible refactorer claude refactorer 
window-invisible architect claude architect batch 
